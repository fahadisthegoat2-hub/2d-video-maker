<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// =====================================================================
//  2D VIDEO ENGINE — every pixel drawn in code
//  Characters: limited / choppy animation (held poses, ~8fps)

// =====================================================================
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1920, H = 1080, FONT = '"DejaVu Sans", Arial, sans-serif', MONO = '"DejaVu Sans Mono", monospace';
let SCENES = [], FPS = 30, META = {};

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);

  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);

}
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function box(x, y, w, h, f, r = 0) { rr(x, y, w, h, r); X.fillStyle = f; X.fill(); }
function ell(x, y, rx, ry, fill, rot = 0) { X.beginPath(); X.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, 7); if (fill) { X.fillStyle = fill; X.fill(); } }
function line(x0, y0, x1, y1, col, w) { X.beginPath(); X.moveTo(x0, y0); X.lineTo(x1, y1); X.strokeStyle = col; X.lineWidth = w; X.stroke(); }
function glow(col, blur) { X.shadowColor = col; X.shadowBlur = blur; }

function lin(x0, y0, x1, y1, stops) { const g = X.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }

// ---------- post-fx buffers ----------
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const BL = mk(480, 270), BX = BL.getContext('2d');
const FB = mk(W, H), FX = FB.getContext('2d');
const GR = mk(256, 256); { const g = GR.getContext('2d'), id = g.createImageData(256, 256); for (let i = 0; i < id.data.length; i += 4) { const v = Math.random() * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; } g.putImageData(id, 0, 0); }
const SL = mk(4, 4); { const g = SL.getContext('2d'); g.fillStyle = 'rgba(0,0,0,.5)'; g.fillRect(0, 0, 4, 1); }
let GRP, SLP;

// ---------- palettes ----------
const PAL = {
  warm: { wall: '#e9d9b8', wood: '#7a4f30', woodD: '#563521', floor: '#8a5a38', rug: '#583443', rugB: '#d4a63c', light: 'rgba(255,214,150,', sky: ['#8ec5f5', '#c9e5fb'] },
  cool: { wall: '#d9dfe6', wood: '#4c5566', woodD: '#353c4a', floor: '#6e6a66', rug: '#2f4b6e', rugB: '#c9d3df', light: 'rgba(190,220,255,', sky: ['#6f8fb8', '#b9cbe0'] },
  night: { wall: '#5b5f7a', wood: '#3a2f3f', woodD: '#261d2a', floor: '#3a2e30', rug: '#3b2346', rugB: '#b08a3c', light: 'rgba(160,180,255,', sky: ['#0d1638', '#2a3566'] },
};

// =====================================================================
//  CHARACTERS — detailed flat-shaded, LIMITED ANIMATION
// =====================================================================
const SKIN = { light: '#f3cfae', tan: '#e6ae86', medium: '#c98a5e', brown: '#9a6240', dark: '#6b4128' };
// arm poses: [rightUpper, rightFore, leftUpper, leftFore]; + = inward, - = outward
const POSES = {
  rest: [.06, .08, .06, .08], explain: [-.3, -1.45, .06, .08], point: [-1.95, -.25, .06, .08],
  chest: [-.3, -1.45, .12, 1.95], open: [-.55, -.7, -.55, -.7], hips: [-.55, 2.1, -.55, 2.1],
  shrug: [-.25, -1.9, -.25, -1.9], fist: [-.2, -2.3, .12, 1.95],

const TALK = ['explain', 'chest', 'open', 'point', 'explain', 'shrug', 'chest'];

function drawCharacter(c, t, speaking) {
  const s = (c.size || 1) * (c.scale || 1.1), x = c.x * W, y = (c.y || .94) * H;

  X.save(); torso(); X.clip();
  line(0, top + 10, 0, bot, 'rgba(0,0,0,.12)', 3);                                 // placket
  for (let i = 0; i < 4; i++) ell(6, top + 45 + i * 48, 4, 4, 'rgba(0,0,0,.28)');
  X.strokeStyle = 'rgba(0,0,0,.08)'; X.lineWidth = 3;                                // fabric folds
  X.beginPath(); X.moveTo(-tw / 2 + 20, bot - 30); X.quadraticCurveTo(-20, bot - 60, -10, bot - 10); X.moveTo(tw / 2 - 25, bot - 50); X.quadraticCurveTo(20, bot - 40, 30, bot - 5); X.stroke();
  box(tw / 2 - 40, top, 40, bot - top, 'rgba(0,0,0,.08)');                         // shadow side
  if (c.vest) {
    for (const sx of [-1, 1]) {
      X.beginPath(); X.moveTo(sx * 22, top); X.lineTo(sx * (tw / 2 + 2), top + 6); X.lineTo(sx * (tw / 2 + 2), bot + 6);
      X.lineTo(sx * 18, bot + 6); X.lineTo(sx * 14, top + 125); X.closePath();
      X.fillStyle = sx < 0 ? hex(c.vest, .06) : hex(c.vest, -.12); X.fill();
      X.strokeStyle = hex(c.vest, -.3); X.lineWidth = 2.5; X.stroke();

    }

      X.setLineDash([3, 4]); X.strokeStyle = '#d6a83c'; X.lineWidth = 3; X.beginPath(); X.moveTo(-60, top + 160); X.quadraticCurveTo(-30, top + 190, 10, top + 150); X.stroke(); X.setLineDash([]);
    }

    for (const sx of [-1, 1]) {
      X.beginPath(); X.moveTo(sx * 16, top); X.lineTo(sx * (tw / 2 + 2), top + 6); X.lineTo(sx * (tw / 2 + 2), bot + 6); X.lineTo(sx * 4, bot + 6); X.lineTo(sx * 4, top + 150); X.closePath();
      X.fillStyle = sx < 0 ? c.suit : hex(c.suit, -.18); X.fill();
      X.beginPath(); X.moveTo(sx * 16, top); X.lineTo(sx * 46, top + 40); X.lineTo(sx * 30, top + 60); X.lineTo(sx * 6, top + 150); X.fillStyle = hex(c.suit, sx < 0 ? .12 : -.28); X.fill();

    X.beginPath(); X.moveTo(-10, top + 10); X.lineTo(10, top + 10); X.lineTo(14, top + 150); X.lineTo(0, top + 172); X.lineTo(-14, top + 150); X.closePath(); X.fillStyle = c.tie || '#2c5aa0'; X.fill();

  X.restore();
  // collar
  X.fillStyle = hex(shirt, .3); X.beginPath(); X.moveTo(-38, top - 4); X.lineTo(-2, top + 30); X.lineTo(-6, top + 2); X.lineTo(-22, top - 14); X.fill();

    X.strokeStyle = 'rgba(0,0,0,.1)'; X.lineWidth = 3; X.beginPath(); X.arc(0, 104, 14, .3, 2.8); X.stroke();
    X.translate(0, 110); X.rotate(sx * f);
    X.strokeStyle = col; X.lineWidth = 40; X.beginPath(); X.moveTo(0, 0); X.lineTo(0, 88); X.stroke();

    X.strokeStyle = hex(skin, -.25); X.lineWidth = 2; X.beginPath(); X.moveTo(-8, 128); X.lineTo(-8, 136); X.moveTo(2, 130); X.lineTo(2, 139); X.moveTo(11, 128); X.lineTo(11, 136); X.stroke();

  X.save(); X.translate(0, top - 128); X.scale(hs, hs); X.rotate(tilt);

  X.restore();
  X.restore();
}
function headPath(R) {
  X.beginPath(); X.moveTo(0, -R - 14); X.bezierCurveTo(R * 1.06, -R - 14, R * 1.08, R * .5, R * .58, R * .97);

}
function drawHead(c, t, speaking, skin, hairC, id) {
  const R = 98, sk = k => hex(skin, k), old = !!c.old || (c.beard && /#[89a-f]/i.test(String(c.hair)));
  const beardC = c.beard === true ? hairC : c.beard;

  ell(-R * .4, -R * .55, R * .5, R * .3, 'rgba(255,255,255,.12)');                 // forehead spec

  // wrinkles

    X.strokeStyle = sk(-.3); X.lineWidth = 2.5; X.lineCap = 'round';
    for (let i = 0; i < 3; i++) { X.beginPath(); X.moveTo(-40 + i * 4, -62 - i * 12); X.quadraticCurveTo(0, -68 - i * 12, 40 - i * 4, -62 - i * 12); X.stroke(); }
    for (const sx of [-1, 1]) { X.beginPath(); X.moveTo(sx * 74, -14); X.lineTo(sx * 84, -20); X.moveTo(sx * 74, -4); X.lineTo(sx * 85, -2); X.stroke(); X.beginPath(); X.moveTo(sx * 26, 30); X.quadraticCurveTo(sx * 40, 50, sx * 34, 66); X.stroke(); }
  }

    X.beginPath(); X.moveTo(-R * .98, -4); X.quadraticCurveTo(-R * 1.02, R * .8, -R * .45, R * 1.04); X.quadraticCurveTo(0, R * 1.28, R * .45, R * 1.04);
    X.quadraticCurveTo(R * 1.02, R * .8, R * .98, -4); X.quadraticCurveTo(R * .75, R * .45, 0, R * .52); X.quadraticCurveTo(-R * .75, R * .45, -R * .98, -4);
