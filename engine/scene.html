<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// ============ 2D VIDEO ENGINE — every pixel drawn procedurally ============
const C = document.getElementById('c'), X = C.getContext('2d');
const W = 1920, H = 1080;
let SCENES = [], FPS = 30;

// ---------- utils ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const back = t => { t = clamp(t); const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
const noise = (t, s = 0) => Math.sin(t * 1.3 + s) * .5 + Math.sin(t * 2.7 + s * 1.7) * .3 + Math.sin(t * 5.1 + s * 2.3) * .2;
function hex(c, k = 0) { // shade hex color: k<0 darker, k>0 lighter
  let n = parseInt(c.slice(1), 16), r = n >> 16, g = n >> 8 & 255, b = n & 255;
  const f = v => Math.round(k < 0 ? v * (1 + k) : v + (255 - v) * k);
  return `rgb(${f(r)},${f(g)},${f(b)})`;
}
function rr(x, y, w, h, r) { X.beginPath(); X.roundRect(x, y, w, h, r); }
function ell(x, y, rx, ry, fill, rot = 0) { X.beginPath(); X.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, 7); if (fill) { X.fillStyle = fill; X.fill(); } }
function glow(col, blur) { X.shadowColor = col; X.shadowBlur = blur; }
function noGlow() { X.shadowBlur = 0; X.shadowColor = 'transparent'; }
function lin(x0, y0, x1, y1, stops) { const g = X.createLinearGradient(x0, y0, x1, y1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }
function rad(x, y, r0, r1, stops) { const g = X.createRadialGradient(x, y, r0, x, y, r1); stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c)); return g; }

// ---------- palettes ----------
const PAL = {
  warm: { wall: '#e7d6b4', wallD: '#cdb68f', wood: '#7a4f30', woodD: '#5a3720', floor: '#8a5a38', rug: '#5b3442', rugB: '#d4a63c', light: 'rgba(255,214,150,' },
  cool: { wall: '#d6dde6', wallD: '#aab5c3', wood: '#4c5566', woodD: '#353c4a', floor: '#6e6a66', rug: '#2f4b6e', rugB: '#c9d3df', light: 'rgba(190,220,255,' },
  royal: { wall: '#f2e6cf', wallD: '#d9c39c', wood: '#5a3324', woodD: '#3d2017', floor: '#6b3d2a', rug: '#7b2f2f', rugB: '#e0b44c', light: 'rgba(255,230,180,' },
};

// ================= CHARACTERS =================
const SKIN = { light: '#f1c9a5', tan: '#e0a982', medium: '#c98a5e', brown: '#9a6240', dark: '#6b4128' };
function drawCharacter(c, t, speaking) {
  const s = (c.size || 1) * (c.scale || 1.3);
  const x = c.x * W, y = (c.y || .88) * H;
  const skin = SKIN[c.skin] || c.skin || SKIN.tan;
  const shirt = c.shirt || '#d8d2c4', pants = c.pants || '#3c3f4a', hairC = c.hair || '#2a2220';
  const kid = c.kid != null; const hs = kid ? 1.18 : 1;     // head scale
  const breathe = Math.sin(t * 2.2 + c.x * 9) * 3;
  const bob = speaking ? Math.abs(Math.sin(t * 7)) * 3 : 0;
  X.save(); X.translate(x, y); X.scale(s * (c.flip ? -1 : 1), s);
  // ground shadow
  ell(0, 0, 120, 22, 'rgba(20,10,5,.28)');
  // legs + shoes
  for (const sx of [-1, 1]) {
    rr(sx * 30 - 22, -190, 44, 182, 14); X.fillStyle = pants; X.fill();
    rr(sx * 30 - 22, -190, 16, 182, 8); X.fillStyle = 'rgba(0,0,0,.12)'; X.fill();
    if (kid) { rr(sx * 30 - 20, -95, 40, 80, 8); X.fillStyle = '#9b9a98'; X.fill(); }
    ell(sx * 36, -8, 46, 17, '#2b211c'); ell(sx * 30, -14, 22, 6, 'rgba(255,255,255,.12)');
  }
  X.translate(0, -breathe * .3 - bob);
  // torso
  const tw = 165, top = -410, bot = kid ? -160 : -175;
  X.beginPath(); X.moveTo(-tw / 2, top + 20); X.quadraticCurveTo(-tw / 2, top, -tw / 2 + 30, top);
  X.lineTo(tw / 2 - 30, top); X.quadraticCurveTo(tw / 2, top, tw / 2, top + 20);
  X.lineTo(tw / 2 - 8, bot); X.lineTo(-tw / 2 + 8, bot); X.closePath();
  X.fillStyle = lin(-tw / 2, 0, tw / 2, 0, [hex(shirt, .1), shirt, hex(shirt, -.22)]); X.fill();
  if (c.vest) { // open vest panels
    for (const sx of [-1, 1]) {
      X.beginPath(); X.moveTo(sx * 26, top); X.lineTo(sx * (tw / 2 - 18), top + 4); X.lineTo(sx * (tw / 2 - 8), bot);
      X.lineTo(sx * 20, bot); X.lineTo(sx * 14, top + 120); X.closePath();
      X.fillStyle = sx < 0 ? hex(c.vest, .05) : hex(c.vest, -.12); X.fill();
    }
    X.fillStyle = '#2b2b2b'; rr(-48, top + 75, 14, 22, 3); X.fill(); ell(-41, top + 108, 10, 10, '#d4a63c');
  }
  if (c.suit) { // jacket + tie
    for (const sx of [-1, 1]) { X.beginPath(); X.moveTo(sx * 18, top); X.lineTo(sx * (tw / 2), top + 10); X.lineTo(sx * (tw / 2 - 8), bot); X.lineTo(sx * 6, bot); X.closePath(); X.fillStyle = sx < 0 ? c.suit : hex(c.suit, -.15); X.fill(); }
    X.beginPath(); X.moveTo(-9, top + 8); X.lineTo(9, top + 8); X.lineTo(12, top + 150); X.lineTo(0, top + 168); X.lineTo(-12, top + 150); X.closePath(); X.fillStyle = c.tie || '#2c5aa0'; X.fill();
  }
  for (let i = 0; i < 4; i++) ell(c.vest || c.suit ? 0 : 0, top + 40 + i * 45, 3.5, 3.5, 'rgba(0,0,0,.25)');
  // arms
  const sh = top + 30;
  const armL = c.pose === 'hips' ? 2.6 : 0.12 + Math.sin(t * 1.6) * .03;
  const armR = speaking ? -0.4 - (Math.sin(t * 3.1) * .5 + .5) * 1.0 + noise(t * 2, 3) * .15 : -0.12 + Math.sin(t * 1.4 + 1) * .03;
  const drawArm = (sx, ang, bend) => {
    X.save(); X.translate(sx * (tw / 2 - 12), sh); X.rotate(sx * ang);
    X.lineCap = 'round'; X.strokeStyle = sx > 0 ? hex(shirt, -.12) : shirt; X.lineWidth = 40;
    X.beginPath(); X.moveTo(0, 0); X.lineTo(sx * 6, 105); X.stroke();
    X.translate(sx * 6, 105); X.rotate(sx * bend);
    X.beginPath(); X.moveTo(0, 0); X.lineTo(0, 95); X.stroke();
    ell(0, 112, 21, 23, skin); ell(sx * -8, 108, 8, 6, hex(skin, -.08));
    if (sx > 0 && c.prop) drawProp(c.prop, t);
    X.restore();
  };
  drawArm(-1, armL, c.pose === 'hips' ? -2.2 : -0.15);
  drawArm(1, armR, speaking ? -0.9 - Math.sin(t * 3.1) * .2 : -0.15);
  // neck
  rr(-22, top - 40, 44, 50, 10); X.fillStyle = hex(skin, -.12); X.fill();
  // collar
  X.fillStyle = hex(shirt, .25); X.beginPath(); X.moveTo(-34, top - 2); X.lineTo(0, top + 26); X.lineTo(34, top - 2); X.lineTo(20, top - 12); X.lineTo(0, top + 6); X.lineTo(-20, top - 12); X.fill();
  // ---- head ----
  X.save(); X.translate(0, top - 120); X.scale(hs, hs); X.rotate(noise(t * .6, c.x * 10) * .04 + (speaking ? Math.sin(t * 4.3) * .02 : 0));
  drawHead(c, t, speaking, skin, hairC);
  X.restore();
  X.restore();
}
function drawHead(c, t, speaking, skin, hairC) {
  const R = 96;
  // back hair
  if (c.longhair) { rr(-R - 8, -R + 10, 2 * R + 16, 2 * R - 10, 60); X.fillStyle = hex(hairC, -.1); X.fill(); }
  // ears
  for (const sx of [-1, 1]) { ell(sx * (R - 4), 12, 20, 26, hex(skin, -.05)); ell(sx * (R - 2), 12, 9, 14, hex(skin, -.2)); }
  // skull — slightly wider jaw
  X.beginPath(); X.moveTo(0, -R - 12); X.bezierCurveTo(R * 1.05, -R - 12, R * 1.05, R * .55, R * .55, R * .98);
  X.quadraticCurveTo(0, R * 1.18, -R * .55, R * .98); X.bezierCurveTo(-R * 1.05, R * .55, -R * 1.05, -R - 12, 0, -R - 12);
  X.fillStyle = rad(-30, -40, 10, R * 1.5, [hex(skin, .12), skin, hex(skin, -.18)]); X.fill();
  // cheeks
  ell(-55, 38, 20, 12, 'rgba(230,110,90,.18)'); ell(55, 38, 20, 12, 'rgba(230,110,90,.18)');
  // beard
  if (c.beard) {
    X.beginPath(); X.moveTo(-R * .95, 0); X.quadraticCurveTo(-R, R * .8, -R * .5, R * 1.02); X.quadraticCurveTo(0, R * 1.3, R * .5, R * 1.02);
    X.quadraticCurveTo(R, R * .8, R * .95, 0); X.quadraticCurveTo(R * .7, R * .5, 0, R * .5); X.quadraticCurveTo(-R * .7, R * .5, -R * .95, 0);
    X.fillStyle = c.beard === true || c.beard === 'yes' ? hairC : c.beard; X.fill();
    X.strokeStyle = 'rgba(0,0,0,.15)'; X.lineWidth = 2; for (let i = 0; i < 14; i++) { const a = -2.6 + i * .37; X.beginPath(); X.moveTo(Math.cos(a) * R * .6, R * .5 + Math.sin(-a) * 20 + 30); X.lineTo(Math.cos(a) * R * .6, R * .5 + Math.sin(-a) * 20 + 40); X.stroke(); }
    // mustache
    X.beginPath(); X.ellipse(-20, 48, 26, 10, -.2, 0, 7); X.ellipse(20, 48, 26, 10, .2, 0, 7); X.fillStyle = hex(c.beard === true || c.beard === 'yes' ? hairC : c.beard, -.08); X.fill();
  }
  // eyes
  const blinkP = (t + c.x * 7) % 3.7, blink = blinkP < .12 ? Math.abs(Math.sin(blinkP / .12 * Math.PI)) : 0;
  const look = c.look ?? (c.x < .5 ? 1 : -1);
  const ex = 38, ey = -6, er = c.kid != null ? 34 : 30;
  for (const sx of [-1, 1]) {
    X.save(); X.translate(sx * ex, ey); X.scale(1, 1 - blink * .95);
    ell(0, 0, er, er * 1.08, '#fff'); X.lineWidth = 3; X.strokeStyle = 'rgba(60,40,30,.55)'; X.stroke();
    const px = look * 9 + noise(t * .8, 5) * 4, py = 2 + noise(t * .7, 8) * 3;
    ell(px, py, er * .42, er * .46, c.eyes || '#5a7fa6'); ell(px, py, er * .24, er * .27, '#1a1412');
    ell(px - 5, py - 6, 5, 5, '#fff');
    X.restore();
  }
  // brows
  const mood = c.mood || 'neutral';
  const ang = mood === 'angry' ? .35 : mood === 'sad' ? -.3 : mood === 'happy' ? -.08 : .05;
  const raise = speaking ? Math.max(0, Math.sin(t * 2.3)) * 6 : 0;
  for (const sx of [-1, 1]) { X.save(); X.translate(sx * ex, ey - er - 14 - raise); X.rotate(sx * ang); rr(-24, -6, 48, 12, 6); X.fillStyle = c.brows || hex(hairC, -.1); X.fill(); X.restore(); }
  // nose
  X.beginPath(); X.moveTo(-2, 18); X.quadraticCurveTo(-12, 34, 2, 36); X.strokeStyle = hex(skin, -.3); X.lineWidth = 4; X.lineCap = 'round'; X.stroke();
  // mouth
  const my = 60;
  if (speaking) {
    const o = clamp(.25 + noise(t * 9, 1) * .6 + Math.sin(t * 17) * .2, .05, 1);
    ell(0, my, 20 + o * 4, 4 + o * 14, '#3b1a16'); X.save(); X.clip(); ell(0, my + 10 + o * 6, 14, 8, '#d0605a'); rr(-14, my - 4 - o * 14, 28, 7, 2); X.fillStyle = '#fff'; X.fill(); X.restore();
  } else if (mood === 'angry') { rr(-24, my - 8, 48, 18, 6); X.fillStyle = '#fff'; X.fill(); X.strokeStyle = '#3b1a16'; X.lineWidth = 3; X.stroke(); for (let i = -2; i <= 2; i++) { X.beginPath(); X.moveTo(i * 9, my - 8); X.lineTo(i * 9, my + 10); X.stroke(); } }
  else { X.beginPath(); const cv = mood === 'happy' ? 12 : mood === 'sad' ? -10 : 2; X.moveTo(-18, my); X.quadraticCurveTo(0, my + cv, 18, my - 2); X.strokeStyle = '#3b1a16'; X.lineWidth = 4.5; X.stroke(); }
  // hair
  if (!c.bald) {
    X.fillStyle = hairC;
    X.beginPath(); X.moveTo(-R - 4, 10); X.bezierCurveTo(-R - 18, -R - 30, R + 18, -R - 40, R + 4, 6);
    X.quadraticCurveTo(R - 10, -R * .55, R * .2, -R * .62); X.quadraticCurveTo(-R * .3, -R * .35, -R * .6, -R * .62); X.quadraticCurveTo(-R * .85, -R * .3, -R - 4, 10); X.fill();
    X.strokeStyle = hex(hairC, .18); X.lineWidth = 4; for (let i = 0; i < 4; i++) { X.beginPath(); X.moveTo(-50 + i * 30, -R - 4); X.quadraticCurveTo(-30 + i * 30, -R * .8, -10 + i * 30, -R * .66); X.stroke(); }
  } else { ell(-R + 8, 0, 14, 28, c.hair || '#999'); ell(R - 8, 0, 14, 28, c.hair || '#999'); }
  if (c.helmet) { X.beginPath(); X.arc(0, -10, R + 14, Math.PI * 1.02, Math.PI * 1.98); X.lineTo(R + 14, 60); X.lineTo(R - 10, 60); X.lineTo(R - 14, -10); X.quadraticCurveTo(0, -R * .55, -R + 14, -10); X.lineTo(-R + 10, 60); X.lineTo(-R - 14, 60); X.closePath(); X.fillStyle = lin(0, -R, 0, 60, [hex(c.helmet, .2), c.helmet, hex(c.helmet, -.3)]); X.fill(); }
  if (c.glasses) { X.lineWidth = 5; X.strokeStyle = c.glasses === true || c.glasses === 'yes' ? '#b8862e' : c.glasses; for (const sx of [-1, 1]) { X.beginPath(); X.arc(sx * ex, ey, 40, 0, 7); X.stroke(); } X.beginPath(); X.moveTo(-ex + 40, ey); X.quadraticCurveTo(0, ey - 8, ex - 40, ey); X.stroke(); ell(-ex - 10, ey - 15, 10, 5, 'rgba(255,255,255,.35)'); }
}
function drawProp(p, t) {
  X.save(); X.translate(0, 112);
  if (p === "hammer") { X.rotate(2.6); rr(-6, -120, 12, 130, 4); X.fillStyle = '#7a4f30'; X.fill(); rr(-36, -150, 72, 40, 6); X.fillStyle = '#8f99a6'; X.fill(); rr(-36, -150, 72, 12, 6); X.fillStyle = '#b9c2cc'; X.fill(); }
  else if (p === 'book') { X.rotate(-.2); rr(-40, -50, 80, 60, 4); X.fillStyle = '#7b2f2f'; X.fill(); rr(-36, -46, 72, 52, 3); X.fillStyle = '#f2ead8'; X.fill(); }
  else if (p === 'orb') { glow('#b07cff', 40); ell(0, -30, 26, 26, '#c9a6ff'); noGlow(); for (let i = 0; i < 6; i++) { const a = t * 3 + i; ell(Math.cos(a) * 46, -30 + Math.sin(a * 1.3) * 46, 4, 4, 'rgba(190,150,255,.8)'); } }
  X.restore();
}

// ================= BACKGROUNDS =================
function bgRoom(sc, t) {
  const p = PAL[sc.palette] || PAL.warm, R = rng(sc.seed);
  const horizon = H * .66;
  X.fillStyle = p.wall; X.fillRect(0, 0, W, horizon);
  // vertical panels
  for (let x = 0; x < W; x += 120) { X.fillStyle = 'rgba(0,0,0,.05)'; X.fillRect(x, 0, 3, horizon); X.fillStyle = 'rgba(255,255,255,.08)'; X.fillRect(x + 3, 0, 2, horizon); }
  // wainscot
  X.fillStyle = p.wood; X.fillRect(0, H * .44, W, horizon - H * .44); X.fillStyle = p.woodD; X.fillRect(0, H * .44, W, 14);
  for (let x = 0; x < W; x += 160) { X.fillStyle = 'rgba(0,0,0,.14)'; X.fillRect(x, H * .44 + 14, 4, horizon - H * .44); }
  // window
  const wx = 120, wy = 0, ww = 420, wh = H * .42;
  X.fillStyle = lin(0, wy, 0, wy + wh, ['#8ec5f5', '#c7e4fb']); X.fillRect(wx, wy, ww, wh);
  X.fillStyle = '#d9a184'; for (let i = 0; i < 6; i++) { const bw = 40 + R() * 60, bh = 40 + R() * 90; X.fillRect(wx + i * 75, wy + wh - bh, bw, bh); X.fillRect(wx + i * 75 + 10, wy + wh - bh - 22, 12, 22); }
  X.strokeStyle = p.woodD; X.lineWidth = 16; X.strokeRect(wx, wy - 10, ww, wh + 10); X.lineWidth = 10;
  X.beginPath(); X.moveTo(wx + ww / 2, wy); X.lineTo(wx + ww / 2, wy + wh); X.moveTo(wx, wy + wh * .55); X.lineTo(wx + ww, wy + wh * .55); X.stroke();
  // curtains (sway)
  for (const sx of [0, 1]) { const cx = sx ? wx + ww - 40 : wx - 50; X.beginPath(); X.moveTo(cx, 0); X.lineTo(cx + 90, 0); X.quadraticCurveTo(cx + 70 + Math.sin(t) * 6, wh * .6, cx + 80 + Math.sin(t * .8) * 8, wh + 40); X.lineTo(cx - 10, wh + 40); X.closePath(); X.fillStyle = lin(cx, 0, cx + 90, 0, ['#e9c48c', '#f4dcae', '#d6aa6c']); X.fill(); }
  // sill + plant
  X.fillStyle = p.woodD; X.fillRect(wx - 70, wy + wh, ww + 140, 22);
  X.fillStyle = '#c2683e'; X.beginPath(); X.moveTo(wx + 40, wy + wh); X.lineTo(wx + 110, wy + wh); X.lineTo(wx + 100, wy + wh - 50); X.lineTo(wx + 50, wy + wh - 50); X.fill();
  for (let i = 0; i < 6; i++) ell(wx + 75 + Math.cos(i) * 28 + Math.sin(t + i) * 2, wy + wh - 80 + Math.sin(i * 2) * 20, 22, 14, '#4f8a3c', i);
  for (let i = 0; i < 3; i++) ell(wx + 65 + i * 12, wy + wh - 110 + i * 5, 7, 7, '#d8382f');
  // clock with pendulum
  const cx = W * .4, cy = 30;
  rr(cx - 55, cy - 30, 110, 320, 8); X.fillStyle = p.woodD; X.fill();
  ell(cx, cy + 60, 42, 42, '#f3ead6'); X.strokeStyle = '#222'; X.lineWidth = 4; X.lineCap = 'round';
  X.beginPath(); X.moveTo(cx, cy + 60); X.lineTo(cx + Math.cos(t * .2) * 26, cy + 60 + Math.sin(t * .2) * 26); X.moveTo(cx, cy + 60); X.lineTo(cx + Math.cos(t * 2) * 34, cy + 60 + Math.sin(t * 2) * 34); X.stroke();
  rr(cx - 30, cy + 115, 60, 160, 4); X.fillStyle = '#2a1a12'; X.fill();
  const pa = Math.sin(t * 3) * .25; X.save(); X.translate(cx, cy + 120); X.rotate(pa); X.fillStyle = '#d4a63c'; X.fillRect(-3, 0, 6, 120); ell(0, 128, 16, 16, '#e0b44c'); X.restore();
  // tool board
  const bx = W * .7, by = 10; X.fillStyle = hex(p.wood, .05); X.fillRect(bx, by, 520, 270); X.fillStyle = 'rgba(0,0,0,.15)'; X.fillRect(bx, by + 260, 520, 10);
  for (let i = 0; i < 9; i++) { X.fillStyle = i % 3 ? '#9aa3ad' : '#c48a3c'; X.fillRect(bx + 30 + i * 55, by + 40, 8, 80 + (i % 4) * 20); ell(bx + 34 + i * 55, by + 150 + (i % 4) * 20, 10, 12, '#b98a3a'); }
  // floor
  X.fillStyle = lin(0, horizon, 0, H, [hex(p.floor, -.1), p.floor]); X.fillRect(0, horizon, W, H - horizon);
  X.strokeStyle = 'rgba(0,0,0,.12)'; X.lineWidth = 3;
  for (let i = -12; i < 13; i++) { X.beginPath(); X.moveTo(W / 2 + i * 70, horizon); X.lineTo(W / 2 + i * 260, H); X.stroke(); }
  // table
  const tx = W * .64, ty = horizon - 40; X.fillStyle = p.woodD; X.fillRect(tx, ty, 640, 30); X.fillRect(tx + 20, ty + 30, 26, 210); X.fillRect(tx + 590, ty + 30, 26, 210);
  X.fillStyle = hex(p.woodD, .12); X.fillRect(tx, ty, 640, 8);
  ell(tx + 120, ty - 14, 70, 16, '#3c4350'); rr(tx + 70, ty - 50, 110, 36, 6); X.fillStyle = '#4a5260'; X.fill();
  glow('#ffcc66', 30); ell(tx + 260, ty - 50 + Math.sin(t * 20) * 2, 7, 16, '#ffe08a'); noGlow(); rr(tx + 240, ty - 36, 40, 36, 10); X.fillStyle = 'rgba(190,220,240,.8)'; X.fill();
  // rug
  X.beginPath(); X.moveTo(W * .12, H * .97); X.lineTo(W * .26, horizon + 50); X.lineTo(W * .74, horizon + 50); X.lineTo(W * .88, H * .97); X.closePath(); X.fillStyle = p.rug; X.fill(); X.strokeStyle = p.rugB; X.lineWidth = 8; X.stroke();
  // window light shaft
  X.save(); X.globalCompositeOperation = 'lighter';
  X.beginPath(); X.moveTo(wx, wy); X.lineTo(wx + ww, wy); X.lineTo(wx + ww + 700, H); X.lineTo(wx + 300, H); X.closePath();
  X.fillStyle = lin(wx, 0, wx + 600, H, [p.light + '.16)', p.light + '.0)']); X.fill(); X.restore();
  dust(sc, t, 40, 'rgba(255,240,200,');
}
function bgOutdoor(sc, t) {
  const R = rng(sc.seed), hz = H * .62;
  X.fillStyle = lin(0, 0, 0, hz, ['#6fb3e8', '#bfe0f7', '#e9f3fa']); X.fillRect(0, 0, W, hz);
  glow('rgba(255,240,190,.9)', 120); ell(W * .82, H * .16, 70, 70, '#fff6d8'); noGlow();
  for (let i = 0; i < 6; i++) { const cx = ((R() * W + t * (12 + i * 4)) % (W + 400)) - 200, cy = 60 + R() * 220; X.fillStyle = 'rgba(255,255,255,.9)'; for (let k = 0; k < 4; k++) ell(cx + k * 45, cy - (k % 2) * 20, 60, 30); }
