<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Roboto:wght@400;500&display=swap">
<style>
/* Layout: cinema stage on top, transport bar under it, scene strip + script editor below. Single dark look (screening room). */
:root {
  --bg: #0d0f14; --panel: #161a22; --line: #262c38; --fg: #eef0f4; --dim: #9aa3b2; --accent: #ffcc33; --accent-ink: #1a1405;
  --ui: Roboto, system-ui, sans-serif; --display: Fredoka, Roboto, system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }
.wrap { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 3.2vw, 30px); margin: 0; text-wrap: balance; }
.meta { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
canvas#c { width: 100%; height: 100%; display: block; }
.big-play { position: absolute; inset: 0; margin: auto; width: 92px; height: 92px; border-radius: 50%; border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 34px; cursor: pointer; }
.big-play:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bar input[type=range] { flex: 1 1 220px; min-width: 0; accent-color: var(--accent); }
.time { font-variant-numeric: tabular-nums; color: var(--dim); font-size: 14px; min-width: 92px; }
button { font: 500 15px var(--ui); color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; cursor: pointer; min-height: 44px; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button[aria-pressed=true] { border-color: var(--accent); color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
.status { color: var(--dim); font-size: 14px; min-height: 20px; }
.scenes { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: 0 0 auto; font-size: 13px; padding: 8px 12px; min-height: 36px; text-transform: capitalize; }
.chip.on { border-color: var(--accent); color: var(--accent); }
details { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
summary { cursor: pointer; font-weight: 500; }
textarea { width: 100%; box-sizing: border-box; min-height: 260px; margin-top: 10px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: 13px/1.5 ui-monospace, Menlo, monospace; }
.row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.hint { color: var(--dim); font-size: 13px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header>
    <h1 id="title">__TITLE__</h1>
    <span class="meta" id="meta"></span>
  </header>
  <div class="stage">
    <canvas id="c" width="1920" height="1080" aria-label="Video preview"></canvas>
    <button class="big-play" id="bigPlay" aria-label="Play">▶</button>
  </div>
  <div class="bar">
    <button class="primary" id="play">Play</button>
    <input type="range" id="seek" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span class="time" id="time">0:00 / 0:00</span>
    <button id="voice" aria-pressed="true">Voice on</button>
    <button id="render" class="primary">Render MP4</button>
    <select id="quality" aria-label="Render quality"><option value="1080">1080p</option><option value="720">720p (faster)</option></select>
    <button id="export">Export video</button>
    <button id="save" class="primary" hidden>Save video</button>
  </div>
  <div class="status" id="status" role="status"></div>
  <div class="scenes" id="scenes"></div>
  <details>
    <summary>Edit script</summary>
    <textarea id="script" spellcheck="false" aria-label="Video script"></textarea>
    <div class="row"><button class="primary" id="apply">Update video</button><span class="hint">Scenes are separated by <code>---</code>. Lines like <code>scene: camp</code> set options; other lines are narration.</span></div>
  </details>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
__ENGINE__

<audio id="track" preload="auto" playsinline></audio>
<script type="application/json" id="initial-script">__SCRIPT_JSON__</script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let scenes = [], meta = {}, total = 1, playing = false, t0 = 0, offset = 0, lastScene = -1, rec = null, recBlob = null, ext = 'mp4';
  let tts = null, downloads = null, slowFrames = 0, hasTrack = false, actx = null, adest = null;
  const track = $('track');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  const status = m => { $('status').textContent = m; };
  window.LITE = false;

  function load(text) {
    const parsed = parseScript(text); meta = parsed.meta; scenes = estimateTiming(parsed.scenes, meta.wps || 2.9);
    setup(scenes, 30, meta); total = scenes.reduce((a, s) => a + s.dur, 0) || 1;
    $('meta').textContent = `${scenes.length} scenes · ${fmt(total)}`;
    if (meta.soundtrack && !track.src) { track.src = meta.soundtrack; track.addEventListener('canplay', () => { hasTrack = true; $('voice').textContent = 'Soundtrack on'; }, { once: true }); }
    const strip = $('scenes'); strip.textContent = ''; let acc = 0;
    scenes.forEach((sc, i) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = `${i + 1}. ${sc.type}`; const at = acc; b.onclick = () => seekTo(at + .01); strip.appendChild(b); acc += sc.dur; });
    seekTo(0);
  }
  function sceneAt(T) { let a = 0; for (let i = 0; i < scenes.length; i++) { if (T < a + scenes[i].dur) return [i, a]; a += scenes[i].dur; } return [scenes.length - 1, a]; }
  function draw(T) {
    const s = performance.now(); renderAt(Math.min(T, total - .001)); const ms = performance.now() - s;
    if (playing && !window.LITE && ms > 40 && ++slowFrames > 20) { window.LITE = true; status('Switched to lite mode (no glow) so playback keeps up on this device.'); }
    $('time').textContent = `${fmt(T)} / ${fmt(total)}`; $('seek').value = Math.round(T / total * 1000);
    const [i] = sceneAt(T); document.querySelectorAll('.chip').forEach((c, k) => c.classList.toggle('on', k === i));
  }
  function speak(text) {
    if (hasTrack || $('voice').getAttribute('aria-pressed') !== 'true' || !text) return;
    const clean = text.replace(/\*/g, '');
    if (tts) { tts.speak(clean, { rate: 1.1 }).catch(() => {}); return; }
    if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(clean); u.rate = 1.1; speechSynthesis.speak(u); }
  }
  function stopVoice() { try { tts && tts.stop(); } catch (e) {} if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  function tick() {
    if (!playing) return;
    const T = offset + (performance.now() - t0) / 1000;
    if (hasTrack && !track.paused && Math.abs(track.currentTime - T) > .35) { try { track.currentTime = T; } catch (e) {} }
    if (T >= total) { draw(total); pause(); offset = 0; if (rec) rec.stop(); return; }
    const [i] = sceneAt(T); if (i !== lastScene) { lastScene = i; speak(scenes[i].text); }
    draw(T); if (rec) { const pc = Math.floor(T / total * 100); if (pc !== tick.pc) { tick.pc = pc; status(`Recording… ${pc}% (${fmt(T)} of ${fmt(total)}). Keep this page open and the screen on.`); } }
    requestAnimationFrame(tick);
  }
  function play() { if (playing) return; playing = true; if (hasTrack) { track.currentTime = offset; track.muted = $('voice').getAttribute('aria-pressed') !== 'true'; track.play().catch(() => {}); } t0 = performance.now(); lastScene = -1; $('play').textContent = 'Pause'; $('bigPlay').hidden = true; requestAnimationFrame(tick); }
  function pause() { if (playing) offset = Math.min(total, offset + (performance.now() - t0) / 1000); playing = false; stopVoice(); track.pause(); $('play').textContent = 'Play'; $('bigPlay').hidden = false; }
  function seekTo(T) { const was = playing; if (was) pause(); offset = clamp(T, 0, total); draw(offset); if (was) play(); }

  $('play').onclick = () => playing ? pause() : play();
  $('bigPlay').onclick = play;
  $('seek').oninput = e => seekTo(e.target.value / 1000 * total);
  $('voice').onclick = e => { const on = e.currentTarget.getAttribute('aria-pressed') !== 'true'; e.currentTarget.setAttribute('aria-pressed', on); e.currentTarget.textContent = on ? 'Voice on' : 'Voice off'; if (!on) stopVoice(); track.muted = !on; };
  $('apply').onclick = () => { pause(); try { load($('script').value); status('Video updated.'); try { localStorage.setItem('v2d-draft', $('script').value); } catch (e) {} } catch (err) { status('Could not read the script: ' + err.message); } };

  // ---- render: frame-by-frame MP4 with the soundtrack (WebCodecs) ----
  let rendering = false;
  async function renderMp4() {
    if (rendering) { rendering = false; return; }
    if (!window.VideoEncoder || !window.Mp4Muxer) { status('This browser cannot render MP4 files. Use Chrome or Edge on a computer.'); return; }
    pause(); rendering = true; $('render').textContent = 'Cancel render'; $('save').hidden = true; recBlob = null;
    const fps = 30, N = Math.ceil(total * fps), q = $('quality').value, ow = q === '720' ? 1280 : 1920, oh = q === '720' ? 720 : 1080;
    const out = document.createElement('canvas'); out.width = ow; out.height = oh; const ox = out.getContext('2d');
    try {
      let vcfg = null;
      for (const codec of ['avc1.640028', 'avc1.4d0028', 'avc1.42e028']) { const c = { codec, width: ow, height: oh, bitrate: q === '720' ? 3e6 : 6e6, framerate: fps }; if ((await VideoEncoder.isConfigSupported(c)).supported) { vcfg = c; break; } }
      if (!vcfg) throw new Error('this device has no H.264 encoder');
      let pcm = null, acfg = null, sr = 48000;
      if (meta.soundtrack) {
        status('Preparing the soundtrack…');
        const ab = await (await fetch(meta.soundtrack)).arrayBuffer();
        for (const c of [{ codec: 'mp4a.40.2', sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 }, { codec: 'mp4a.40.2', sampleRate: 44100, numberOfChannels: 2, bitrate: 160000 }, { codec: 'opus', sampleRate: 48000, numberOfChannels: 2, bitrate: 160000 }]) { if (window.AudioEncoder && (await AudioEncoder.isConfigSupported(c)).supported) { acfg = c; break; } }
        if (acfg) { sr = acfg.sampleRate; const dec = await new (window.AudioContext || window.webkitAudioContext)().decodeAudioData(ab); const oc = new OfflineAudioContext(2, Math.ceil(dec.duration * sr), sr); const s = oc.createBufferSource(); s.buffer = dec; s.connect(oc.destination); s.start(); pcm = await oc.startRendering(); }
      }
      const muxer = new Mp4Muxer.Muxer({ target: new Mp4Muxer.ArrayBufferTarget(), fastStart: 'in-memory', video: { codec: 'avc', width: ow, height: oh, frameRate: fps }, audio: pcm ? { codec: acfg.codec === 'opus' ? 'opus' : 'aac', sampleRate: sr, numberOfChannels: 2 } : undefined });
      let err = null;
      const ve = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => { err = e; } }); ve.configure(vcfg);
      const t0r = performance.now(); window.LITE = false;
      for (let n = 0; n < N && rendering; n++) {
        if (err) throw err;
        renderAt(n / fps); ox.drawImage(C, 0, 0, ow, oh);
        const vf = new VideoFrame(out, { timestamp: Math.round(n * 1e6 / fps), duration: Math.round(1e6 / fps) }); ve.encode(vf, { keyFrame: n % 60 === 0 }); vf.close();
        if (n % 10 === 0) { const el = (performance.now() - t0r) / 1000, left = el / (n + 1) * (N - n - 1); status(`Rendering… ${Math.floor(n / N * 100)}%  (frame ${n} of ${N}, about ${fmt(left)} left). You can use other tabs, but keep this one open.`); $('seek').value = Math.round(n / N * 1000); $('time').textContent = `${fmt(n / fps)} / ${fmt(total)}`; await new Promise(r => setTimeout(r, 0)); }
        while (ve.encodeQueueSize > 6) await new Promise(r => setTimeout(r, 1));
      }
      if (!rendering) { ve.close(); status('Render cancelled.'); return; }
      await ve.flush();
      if (pcm) {
        status('Adding the soundtrack…');
        const ae = new AudioEncoder({ output: (c, m) => muxer.addAudioChunk(c, m), error: e => { err = e; } }); ae.configure(acfg);
        const L = pcm.getChannelData(0), R = pcm.getChannelData(1), F = 1024, end = Math.min(pcm.length, Math.ceil(total * sr));
        for (let i = 0; i < end; i += F) { const n = Math.min(F, end - i), d = new Float32Array(n * 2); d.set(L.subarray(i, i + n), 0); d.set(R.subarray(i, i + n), n); const a = new AudioData({ format: 'f32-planar', sampleRate: sr, numberOfFrames: n, numberOfChannels: 2, timestamp: Math.round(i * 1e6 / sr), data: d }); ae.encode(a); a.close(); if (ae.encodeQueueSize > 20) await new Promise(r => setTimeout(r, 0)); }
        await ae.flush(); if (err) throw err;
      }
      muxer.finalize(); recBlob = new Blob([muxer.target.buffer], { type: 'video/mp4' }); ext = 'mp4';
      status(`Done: ${fmt(total)} MP4, ${(recBlob.size / 1048576).toFixed(0)} MB${pcm ? ' with sound' : ''}. Click Save video.`); $('save').hidden = !downloads;
    } catch (e) { status('Render failed: ' + (e && e.message || e) + '. Try 720p, or Chrome/Edge.'); }
    finally { rendering = false; $('render').textContent = 'Render MP4'; }
  }
  $('render').onclick = renderMp4;

  // ---- export: record the canvas in real time on this device ----
  $('export').onclick = () => {
    if (!C.captureStream || !window.MediaRecorder) { status('This browser cannot record video. Try Safari 15+ or Chrome.'); return; }
    const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported(m));
    if (!type) { status('No supported video format for recording here.'); return; }
    ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
    const stream = C.captureStream(30);
    if (hasTrack) { try { if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); const src = actx.createMediaElementSource(track); adest = actx.createMediaStreamDestination(); src.connect(adest); src.connect(actx.destination); } actx.resume(); adest.stream.getAudioTracks().forEach(t => stream.addTrack(t)); } catch (e) {} }
    const chunks = []; rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 8e6 });
    rec.ondataavailable = e => e.data.size && chunks.push(e.data);
    rec.onstop = () => { recBlob = new Blob(chunks, { type }); rec = null; $('export').disabled = false; $('save').hidden = !downloads; status(downloads ? `Recorded ${fmt(total)} (${(recBlob.size / 1048576).toFixed(1)} MB). Tap Save video.` : 'Recorded, but saving files is not available in this view.'); };
    $('export').disabled = true; $('save').hidden = true; status(hasTrack ? 'Recording with the soundtrack… keep this tab open and the screen on until the video ends.' : 'Recording… keep this tab open until the video ends. The voice is not included in the file.');
    pause(); offset = 0; rec.start(250); play();
  };
  $('save').onclick = async () => {
    if (!downloads || !recBlob) return;
    try { await downloads.save({ filename: (meta.name || 'video') + '.' + ext, data: recBlob }); status('Saved.'); }
    catch (e) { status(e && e.code === 'declined' ? 'Save cancelled.' : 'Could not save: ' + ((e && e.message) || 'unknown error')); }
  };

  // ---- boot ----
  const initial = JSON.parse($('initial-script').textContent);
  let text = initial; try { text = localStorage.getItem('v2d-draft') || initial; } catch (e) {}
  $('script').value = text;
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => load(text));
  if (window.claude && claude.use) {
    claude.use('tts').then(t => { tts = t; });
    claude.use('downloads').then(d => { downloads = d; });
  }
})();
</script>
